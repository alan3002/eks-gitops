apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/alan3002/eks-gitops.git
    targetRevision: main
    path: staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

